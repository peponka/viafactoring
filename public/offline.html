<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b6e4f">
<title>Sin conexión · ViaFactoring</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f4ef; color: #101828; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 6px 0 0; font-size: 24px; letter-spacing: -0.02em; }
  p { margin: 0; color: #5b6472; line-height: 1.5; }
  button { margin-top: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #0b6e4f; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>No hay conexión</h1>
  <p>Revisá tu internet. Tus facturas y negociaciones siguen guardadas y van a aparecer apenas vuelva la conexión.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
